name: Update GitHub Streak Stats

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch:     # Allows manual trigger in Actions tab
  push:
    paths:
      - 'update_streak.py'

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Streak Stats SVG
        run: python update_streak.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add streak-stats.svg
          git diff --staged --quiet || (git commit -m "📊 Daily update: GitHub streak stats" && git push)
