<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="50%" stop-color="#141321"/>
      <stop offset="100%" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe428e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a9fef7"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe428e" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe428e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a9fef7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: "Fira Code", monospace, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.5px;
      fill: #a9fef7;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #fe428e;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#2a2b40" stroke-width="1.5" rx="12"/>

  <!-- Background Ambient Waves -->
  <path d="M 0,160 Q 225,120 450,150 T 900,140 L 900,220 L 0,220 Z" fill="url(#wave1)"/>
  <path d="M 0,175 Q 225,145 450,170 T 900,165 L 900,220 L 0,220 Z" fill="url(#wave2)"/>

  <!-- Top Decorative Bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#accent)" rx="2"/>

  <!-- Decorative Badge -->
  <g transform="translate(60, 42)">
    <rect width="148" height="24" rx="12" fill="#fe428e" fill-opacity="0.15" stroke="#fe428e" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#fe428e"/>
    <text x="26" y="16" class="tag">AI &amp; ML SYSTEMS</text>
  </g>

  <!-- Content -->
  <text x="60" y="112" class="title">Gopi Choudhary</text>
  <text x="60" y="148" class="subtitle">Machine Learning &amp; AI Developer <tspan fill="#fe428e">|</tspan> CSE @ NIT Sikkim</text>

  <!-- Tech Dots / Matrix Pattern Right Side -->
  <g transform="translate(760, 45)" opacity="0.4">
    <circle cx="0" cy="0" r="2.5" fill="#a9fef7"/>
    <circle cx="20" cy="0" r="2.5" fill="#fe428e"/>
    <circle cx="40" cy="0" r="2.5" fill="#a9fef7"/>
    <circle cx="60" cy="0" r="2.5" fill="#fe428e"/>
    <circle cx="0" cy="20" r="2.5" fill="#fe428e"/>
    <circle cx="20" cy="20" r="2.5" fill="#a9fef7"/>
    <circle cx="40" cy="20" r="2.5" fill="#fe428e"/>
    <circle cx="60" cy="20" r="2.5" fill="#a9fef7"/>
    <circle cx="0" cy="40" r="2.5" fill="#a9fef7"/>
    <circle cx="20" cy="40" r="2.5" fill="#fe428e"/>
    <circle cx="40" cy="40" r="2.5" fill="#a9fef7"/>
    <circle cx="60" cy="40" r="2.5" fill="#fe428e"/>
    <circle cx="0" cy="60" r="2.5" fill="#fe428e"/>
    <circle cx="20" cy="60" r="2.5" fill="#a9fef7"/>
    <circle cx="40" cy="60" r="2.5" fill="#fe428e"/>
    <circle cx="60" cy="60" r="2.5" fill="#a9fef7"/>
  </g>
</svg>